name: QA Playwright Suite

on:
  # 01:00 UTC ≈ 03:00 Germany (CEST) / 02:00 (CET) — off-peak, cron is UTC (no DST).
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      BASE_URL: ${{ secrets.BASE_URL }}
      FORM_BASE_URL: ${{ secrets.FORM_BASE_URL }}
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      AUTH_JSON_PATH: ${{ secrets.AUTH_JSON_PATH }}
      SERVICE_CASE_FORM_QUERY: ${{ vars.SERVICE_CASE_FORM_QUERY }}
      TRACKING_CASE_ID: ${{ secrets.TRACKING_CASE_ID }}
      TRACKING_TOKEN: ${{ secrets.TRACKING_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate auth state
        run: npm run test:ci:setup

      - name: Asset logs suite (non-blocking)
        continue-on-error: true
        run: npm run test:ci:assetlogs

      - name: Main suite (chromium + serviceform + servicetracking)
        run: npm run test:ci:main

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
